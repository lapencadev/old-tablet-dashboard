# Remote Calendar downloads iCal feeds once a day. This asks every calendar to refresh every 15 minutes.
automations:
  otd_calendar_refresh:
    alias: "Calendars · refresh every 15 min"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/15"
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id: "{{ states.calendar | map(attribute='entity_id') | list }}"
