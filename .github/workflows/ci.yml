name: checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          # oldest Python we support: the one a stock Mac has
          # (ubuntu-latest is 26.04, which has no Python 3.9 builds)
          - { os: ubuntu-24.04, python: "3.9" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci || npm install
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/panel.py check
      # Catch files read without an explicit encoding (what broke on Windows)
      - name: check with a non-UTF-8 locale
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python tools/panel.py check
        env: { LC_ALL: C, PYTHONCOERCECLOCALE: "0", PYTHONUTF8: "0" }
