# Weekly pull requests when a dependency has a security fix or a new version.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    # keep the ranges in requirements.txt; only raise a minimum for a security fix
    versioning-strategy: increase-if-necessary
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /ha-app
    schedule: { interval: weekly }
